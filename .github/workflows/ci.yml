name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests docker

      - name: Lint
        run: python -m ruff check src tests docker

      - name: Run static security analysis
        run: python -m bandit --quiet --recursive src docker

      - name: Audit dependencies
        run: python -m pip_audit . --strict --progress-spinner off

  test:
    name: Tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Build application image
        run: docker compose build

      - name: Start and initialise database
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm db-init
          docker compose run --rm migrate
          docker compose run --rm sources-init

      - name: Run tests
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://anxious_news:anxious_news@localhost:5432/postgres
        run: python -m pytest
