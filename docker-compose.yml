name: anxious-news-bot

x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-anxious_news}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anxious_news}
  POSTGRES_ADMIN_DATABASE: postgres
  APP_DATABASE_NAME: ${POSTGRES_DB:-anxious_news}

x-application-environment: &application-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anxious_news}:${POSTGRES_PASSWORD:-anxious_news}@postgres:5432/${POSTGRES_DB:-anxious_news}
  NEWS_SCHEDULER_INTERVAL_SECONDS: ${NEWS_SCHEDULER_INTERVAL_SECONDS:-60}
  NEWS_FETCH_TIMEOUT_SECONDS: ${NEWS_FETCH_TIMEOUT_SECONDS:-20}
  NEWS_FETCH_RETRY_ATTEMPTS: ${NEWS_FETCH_RETRY_ATTEMPTS:-3}
  NEWS_MAX_CONCURRENCY: ${NEWS_MAX_CONCURRENCY:-5}
  PREFERENCES_MODEL_BASE_URL: ${PREFERENCES_MODEL_BASE_URL:-}
  PREFERENCES_MODEL_API_KEY: ${PREFERENCES_MODEL_API_KEY:-}
  PREFERENCES_MODEL_NAME: ${PREFERENCES_MODEL_NAME:-}
  PREFERENCES_MODEL_TIMEOUT_SECONDS: ${PREFERENCES_MODEL_TIMEOUT_SECONDS:-30}
  PREFERENCES_MODEL_RETRY_ATTEMPTS: ${PREFERENCES_MODEL_RETRY_ATTEMPTS:-2}
  PREFERENCES_MODEL_MAX_RESPONSE_BYTES: ${PREFERENCES_MODEL_MAX_RESPONSE_BYTES:-262144}
  PREFERENCES_HISTORY_QUESTION_LIMIT: ${PREFERENCES_HISTORY_QUESTION_LIMIT:-50}
  PREFERENCES_EXPLICIT_REQUEST_MAX_LENGTH: ${PREFERENCES_EXPLICIT_REQUEST_MAX_LENGTH:-1000}
  PREFERENCES_EXPLICIT_HISTORY_LIMIT: ${PREFERENCES_EXPLICIT_HISTORY_LIMIT:-20}
  PREFERENCES_EXPLICIT_STALE_RETRY_LIMIT: ${PREFERENCES_EXPLICIT_STALE_RETRY_LIMIT:-1}
  PREFERENCES_DUPLICATE_REVIEW_THRESHOLD: ${PREFERENCES_DUPLICATE_REVIEW_THRESHOLD:-0.72}
  PREFERENCES_REPETITION_THRESHOLD: ${PREFERENCES_REPETITION_THRESHOLD:-0.85}
  PREFERENCES_QUESTIONNAIRE_RETENTION_DAYS: ${PREFERENCES_QUESTIONNAIRE_RETENTION_DAYS:-365}
  PREFERENCES_CHANGE_HISTORY_RETENTION_DAYS: ${PREFERENCES_CHANGE_HISTORY_RETENTION_DAYS:-0}
  PREFERENCES_RETENTION_SCAN_INTERVAL_SECONDS: ${PREFERENCES_RETENTION_SCAN_INTERVAL_SECONDS:-86400}
  PREFERENCES_RETENTION_BATCH_SIZE: ${PREFERENCES_RETENTION_BATCH_SIZE:-500}
  RANKING_MODEL_BASE_URL:
  RANKING_MODEL_API_KEY:
  RANKING_MODEL_NAME: ${RANKING_MODEL_NAME:-}
  RANKING_MODEL_TIMEOUT_SECONDS: ${RANKING_MODEL_TIMEOUT_SECONDS:-30}
  RANKING_MODEL_RETRY_ATTEMPTS: ${RANKING_MODEL_RETRY_ATTEMPTS:-3}
  RANKING_MODEL_MAX_RESPONSE_BYTES: ${RANKING_MODEL_MAX_RESPONSE_BYTES:-262144}
  RANKING_CONFIGURATION_VERSION: ${RANKING_CONFIGURATION_VERSION:-1.0}
  RANKING_TIE_POLICY_VERSION: ${RANKING_TIE_POLICY_VERSION:-1.0}
  RANKING_RETENTION_POLICY_VERSION: ${RANKING_RETENTION_POLICY_VERSION:-1.0}
  RANKING_PERSONAL_COEFFICIENT: ${RANKING_PERSONAL_COEFFICIENT:-0.45000}
  RANKING_IMPORTANCE_COEFFICIENT: ${RANKING_IMPORTANCE_COEFFICIENT:-0.20000}
  RANKING_FRESHNESS_COEFFICIENT: ${RANKING_FRESHNESS_COEFFICIENT:-0.15000}
  RANKING_QUALITY_COEFFICIENT: ${RANKING_QUALITY_COEFFICIENT:-0.10000}
  RANKING_NOVELTY_COEFFICIENT: ${RANKING_NOVELTY_COEFFICIENT:-0.10000}
  RANKING_FRESHNESS_HORIZON_SECONDS: ${RANKING_FRESHNESS_HORIZON_SECONDS:-259200}
  RANKING_FUTURE_TOLERANCE_SECONDS: ${RANKING_FUTURE_TOLERANCE_SECONDS:-300}
  RANKING_MINIMUM_SOURCE_QUALITY: ${RANKING_MINIMUM_SOURCE_QUALITY:-0.35000}
  RANKING_MAXIMUM_CANDIDATES: ${RANKING_MAXIMUM_CANDIDATES:-500}
  RANKING_EVENT_CAP: ${RANKING_EVENT_CAP:-2}
  RANKING_TOPIC_CAP: ${RANKING_TOPIC_CAP:-3}
  RANKING_SOURCE_CAP: ${RANKING_SOURCE_CAP:-3}
  RANKING_EXPLICIT_WEIGHT_THRESHOLD: ${RANKING_EXPLICIT_WEIGHT_THRESHOLD:-0.75}
  RANKING_EXPLICIT_RELEVANCE_THRESHOLD: ${RANKING_EXPLICIT_RELEVANCE_THRESHOLD:-0.6000}
  RANKING_EXPLANATION_CONTRIBUTION_LIMIT: ${RANKING_EXPLANATION_CONTRIBUTION_LIMIT:-3}
  RANKING_EVALUATION_RETRY_ATTEMPTS: ${RANKING_EVALUATION_RETRY_ATTEMPTS:-3}
  RANKING_RAW_RESPONSE_RETENTION_DAYS: ${RANKING_RAW_RESPONSE_RETENTION_DAYS:-30}
  RANKING_DETAIL_RETENTION_DAYS: ${RANKING_DETAIL_RETENTION_DAYS:-90}
  RANKING_RETENTION_BATCH_SIZE: ${RANKING_RETENTION_BATCH_SIZE:-500}
  RANKING_RETENTION_SCAN_INTERVAL_SECONDS: ${RANKING_RETENTION_SCAN_INTERVAL_SECONDS:-86400}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anxious_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anxious_news}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d postgres
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  db-init:
    build:
      context: .
    command: ["python", "docker/ensure_database.py"]
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *application-environment
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  sources-init:
    build:
      context: .
    command: ["anxious-news-sources", "apply", "/app/sources.json"]
    environment:
      <<: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  bot:
    build:
      context: .
    environment:
      <<: *application-environment
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    depends_on:
      sources-init:
        condition: service_completed_successfully
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres-data:
